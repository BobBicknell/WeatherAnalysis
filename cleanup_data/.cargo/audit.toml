# cargo-audit overrides.
#
# All entries are reached only transitively through polars / polars-utils (and
# `rand` for chacha20), pinned below any fixed version, and do not affect code
# paths this program uses:
#
#   - RUSTSEC-2025-0141 (bincode 2.0.1, unmaintained, via polars-utils)
#   - RUSTSEC-2026-0194 / 2026-0195 (quick-xml: quadratic dup-attribute check
#     / unbounded namespace-declaration allocation; fixed in >=0.41.0, polars
#     pins 0.39)
#   - chacha20 0.10.1 (yanked, via rand) -- has no advisory ID, so the
#     [yanked] toggle is the only supported suppression
#
# CI's audit-check@v2 runs `cargo audit --deny warnings` (the local pre-push
# hook does the same), and that flag force-enables informational warnings;
# ignoring them by ID is the only compliant suppression. Re-check all entries
# on the next polars upgrade.

[advisories]
ignore = [
    "RUSTSEC-2025-0141", # bincode: unmaintained, pinned by polars-utils
    "RUSTSEC-2026-0194", # quick-xml: quadratic dup-attribute check (polars)
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace allocation (polars)
]

[yanked]
enabled = false # chacha20 0.10.1: yanked, pinned by rand (transitive)