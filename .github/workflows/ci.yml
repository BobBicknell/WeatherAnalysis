name: CI

# Mirrors hooks/pre-push: cargo fmt --check, cargo clippy --all-targets -D
# warnings, cargo test, and cargo audit, run separately for each crate. This
# exists as a backstop for pushes made without `git config core.hooksPath
# hooks` set locally (e.g. a fresh clone, a different machine, an
# accidental --no-verify).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - pull_data
          - cleanup_data
          - plot_data/data-core
          - plot_data/server
          - plot_data/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 on Linux needs GTK/WebKit dev headers to compile, even for
      # `cargo check`/`clippy`/`test` (not just a full `tauri build`).
      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'plot_data/src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: cargo fmt --check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: ${{ matrix.crate }}
        # data-core's end-to-end tests skip themselves when the real
        # weather_all.parquet fixture isn't present, which is the case here.
        run: cargo test

  audit:
    name: audit (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - pull_data
          - cleanup_data
          - plot_data/data-core
          - plot_data/server
          - plot_data/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.crate }}
