[package]
name = "weather-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server for the weather plots frontend, sharing the query core with the Tauri app"

[dependencies]
plot-data-core = { path = "../data-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }