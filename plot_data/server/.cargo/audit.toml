# cargo-audit overrides.
#
# Only two advisories remain, and both are quick-xml, pulled in transitively
# by polars and pinned below the fixed version (>=0.41.0) by polars' own
# dependency requirement. Neither affects code paths this program uses.
#   - RUSTSEC-2026-0194 (quick-xml): quadratic dup-attribute check
#   - RUSTSEC-2026-0195 (quick-xml): unbounded namespace-declaration alloc
#
# Cleared by the polars 0.44 -> 0.55 upgrade and no longer suppressed here:
# RUSTSEC-2025-0003 (fast-float, dropped from the tree), RUSTSEC-2025-0020 and
# RUSTSEC-2026-0177 (pyo3, now 0.39). Re-check the quick-xml pair on the next
# polars upgrade -- they may clear the same way once polars moves past 0.39.

[advisories]
ignore = [
    "RUSTSEC-2026-0194", # quick-xml: quadratic dup-attribute check (polars)
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace allocation (polars)
]