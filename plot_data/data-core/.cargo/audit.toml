# cargo-audit overrides.
#
# These advisories are all transitive through polars (fast-float, pyo3,
# quick-xml), which pins those crates to versions cargo can't move past without
# upgrading polars itself. No fixed version is reachable in the current
# dependency tree, and none of them affect code paths this program uses.
#
# TODO: re-check after upgrading polars to a version with
# pyo3 >= 0.29 / quick-xml >= 0.41; remove entries that no longer resolve.

[advisories]
ignore = [
    "RUSTSEC-2025-0003", # fast-float: segfault, no fixed version (polars)
    "RUSTSEC-2025-0020", # pyo3: PyString::from_object overflow (polars pins pyo3 ~0.21)
    "RUSTSEC-2026-0177", # pyo3: missing Sync on closure (polars pins pyo3 ~0.21)
    "RUSTSEC-2026-0194", # quick-xml: quadratic dup-attribute check (polars)
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace allocation (polars)
]